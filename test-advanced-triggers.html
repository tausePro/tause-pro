<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Advanced Triggers</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Advanced Triggers Test</h1>
        
        <div x-data="triggerTest()" class="space-y-6">
            <!-- Test Button -->
            <button @click="openAdvancedTriggerManagement()" 
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                Open Advanced Trigger Management
            </button>
            
            <!-- Status -->
            <div x-show="showAdvancedManagement" class="p-4 bg-green-100 text-green-800 rounded">
                ✅ Advanced Trigger Management Modal is Open
            </div>
            
            <!-- Modal -->
            <div x-show="showAdvancedManagement" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 class="fixed inset-0 z-50 overflow-y-auto"
                 style="display: none;">
                
                <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
                    <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" @click="showAdvancedManagement = false"></div>
                    
                    <div class="inline-block w-full max-w-4xl p-6 my-8 overflow-hidden text-left align-middle transition-all transform bg-white shadow-xl rounded-lg">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-medium text-gray-900">Advanced Trigger Management</h3>
                            <button @click="showAdvancedManagement = false" class="text-gray-400 hover:text-gray-600">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Create New Trigger Button -->
                        <div class="mb-6">
                            <button @click="createNewTrigger()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                + Create New Trigger
                            </button>
                        </div>
                        
                        <!-- Custom Triggers List -->
                        <div class="space-y-4">
                            <template x-for="trigger in customTriggers" :key="trigger.id">
                                <div class="border border-gray-200 rounded-lg p-4">
                                    <div class="flex items-center justify-between">
                                        <div class="flex-1">
                                            <h4 class="font-medium text-gray-900" x-text="trigger.name"></h4>
                                            <p class="text-sm text-gray-600" x-text="trigger.message"></p>
                                            <div class="mt-2 flex items-center space-x-4 text-xs text-gray-500">
                                                <span>Type: <span x-text="trigger.type"></span></span>
                                                <span>Status: <span x-text="trigger.is_active ? 'Active' : 'Inactive'"></span></span>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button @click="editTrigger(trigger)" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200">
                                                Edit
                                            </button>
                                            <button @click="deleteTrigger(trigger.id)" class="px-3 py-1 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                Delete
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            
                            <div x-show="customTriggers.length === 0" class="text-center py-8 text-gray-500">
                                No custom triggers created yet. Click "Create New Trigger" to get started.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function triggerTest() {
            return {
                showAdvancedManagement: false,
                customTriggers: [
                    {
                        id: 1,
                        name: 'Welcome Message',
                        message: 'Hello! Welcome to our store. How can I help you?',
                        type: 'welcome',
                        is_active: true
                    },
                    {
                        id: 2,
                        name: 'Cart Abandonment',
                        message: 'Don\'t forget your items in the cart!',
                        type: 'cart_abandonment',
                        is_active: false
                    }
                ],

                openAdvancedTriggerManagement() {
                    this.showAdvancedManagement = true;
                    console.log('Advanced Trigger Management opened');
                },

                createNewTrigger() {
                    const name = prompt('Trigger Name:');
                    if (!name) return;
                    
                    const message = prompt('Trigger Message:');
                    if (!message) return;
                    
                    const type = prompt('Trigger Type:') || 'custom';
                    
                    const newTrigger = {
                        id: Date.now(),
                        name: name,
                        message: message,
                        type: type,
                        is_active: true
                    };
                    
                    this.customTriggers.push(newTrigger);
                    alert('Trigger created successfully!');
                },

                editTrigger(trigger) {
                    const name = prompt('Trigger Name:', trigger.name);
                    if (name === null) return;
                    
                    const message = prompt('Trigger Message:', trigger.message);
                    if (message === null) return;
                    
                    const type = prompt('Trigger Type:', trigger.type);
                    if (type === null) return;
                    
                    trigger.name = name;
                    trigger.message = message;
                    trigger.type = type;
                    
                    alert('Trigger updated successfully!');
                },

                deleteTrigger(triggerId) {
                    if (!confirm('Are you sure you want to delete this trigger?')) return;
                    
                    this.customTriggers = this.customTriggers.filter(t => t.id !== triggerId);
                    alert('Trigger deleted successfully!');
                }
            }
        }
    </script>
</body>
</html>
