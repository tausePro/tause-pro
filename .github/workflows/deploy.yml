name: Deploy to AWS Production

on:
  push:
    branches: [ feature/sales-agent-config-view ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, bcmath, curl, zip, pdo, mysql, gd
        
    - name: Install dependencies
      run: composer install --no-dev --optimize-autoloader
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.AWS_SSH_KEY }}
        
    - name: Add server to known hosts
      run: ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts
      
    - name: Deploy to production
      run: |
        # Create deployment package
        tar -czf /tmp/deploy.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.github' \
          --exclude='storage/logs/*' \
          --exclude='storage/framework/cache/*' \
          --exclude='storage/framework/sessions/*' \
          --exclude='storage/framework/views/*' \
          .
          
        # Upload to server
        scp /tmp/deploy.tar.gz ubuntu@${{ secrets.AWS_HOST }}:/tmp/
        
        # Deploy on server
        ssh ubuntu@${{ secrets.AWS_HOST }} "
          cd /var/www/magicai
          
          # Backup current version
          sudo cp -r /var/www/magicai /var/www/magicai_backup_$(date +%Y%m%d_%H%M%S)
          
          # Extract new version
          sudo tar -xzf /tmp/deploy.tar.gz -C /var/www/magicai_new
          sudo rm -rf /var/www/magicai_new
          sudo mkdir -p /var/www/magicai_new
          sudo tar -xzf /tmp/deploy.tar.gz -C /var/www/magicai_new
          
          # Copy new files
          sudo rsync -av --delete /var/www/magicai_new/ /var/www/magicai/
          sudo rm -rf /var/www/magicai_new
          
          # Set permissions
          sudo chown -R www-data:www-data /var/www/magicai
          sudo chmod -R 755 /var/www/magicai
          sudo chmod -R 777 /var/www/magicai/storage
          sudo chmod -R 777 /var/www/magicai/bootstrap/cache
          
          # Install dependencies
          cd /var/www/magicai
          sudo -u www-data composer install --no-dev --optimize-autoloader
          
          # Clear caches
          sudo -u www-data php artisan cache:clear
          sudo -u www-data php artisan config:clear
          sudo -u www-data php artisan route:clear
          sudo -u www-data php artisan view:clear
          
          # Run migrations if needed
          sudo -u www-data php artisan migrate --force
          
          # Restart services
          sudo systemctl reload nginx
          sudo systemctl reload php8.2-fpm
          
          echo '✅ Deployment completed successfully!'
        "
        
    - name: Cleanup
      run: rm -f /tmp/deploy.tar.gz
