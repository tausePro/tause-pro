name: Deploy to Staging

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '**.md'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'staging'
        type: string

env:
  STAGING_HOST: 3.220.198.180
  STAGING_USER: ubuntu
  PROJECT_PATH: /var/www/magicai
  PHP_VERSION: '8.3'

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, pdo_mysql
          coverage: none

      - name: Validate PHP syntax
        run: |
          echo "🔍 Validating PHP syntax..."
          find app -name "*.php" -type f -exec php -l {} \; | grep -v "No syntax errors" || echo "✅ All PHP files valid"

      - name: Check for critical changes
        run: |
          echo "📋 Modified files in this commit:"
          git diff --name-only HEAD~1 | head -20 || echo "No previous commit to compare"

  deploy-to-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.STAGING_HOST }}
          username: ${{ env.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            
            echo "🚀 Starting deployment to staging..."
            echo "📍 Host: ${{ env.STAGING_HOST }}"
            echo "📍 User: ${{ env.STAGING_USER }}"
            echo "📍 Project Path: ${{ env.PROJECT_PATH }}"
            
            cd ${{ env.PROJECT_PATH }} || { echo "❌ Error: Cannot cd to ${{ env.PROJECT_PATH }}"; exit 1; }
            
            # Verificar versión de PHP en servidor
            echo "🔍 Verifying PHP version on server..."
            php8.3 -v || { echo "❌ Error: PHP 8.3 not found on server"; exit 1; }
            echo "✅ PHP 8.3 found"
            
            # Verificar que git está disponible
            git --version || { echo "❌ Error: git not found"; exit 1; }
            
            # Verificar si es un repositorio git válido (con commits)
            IS_GIT_REPO=false
            HAS_COMMITS=false
            
            if [ -d .git ]; then
              IS_GIT_REPO=true
              # Verificar si tiene commits
              if git rev-parse --verify HEAD >/dev/null 2>&1; then
                HAS_COMMITS=true
              fi
            fi
            
            if [ "$IS_GIT_REPO" = false ] || [ "$HAS_COMMITS" = false ]; then
              echo "⚠️ Directory is not a valid git repository (or is empty). Initializing..."
              
              # Backup del código actual si existe
              if [ -f composer.json ]; then
                echo "📦 Backing up existing code..."
                BACKUP_DIR="/tmp/magicai-backup-$(date +%Y%m%d_%H%M%S)"
                sudo mkdir -p $BACKUP_DIR
                sudo cp -r . $BACKUP_DIR/ || echo "⚠️ Backup failed, continuing..."
              fi
              
              # Cambiar permisos temporalmente para permitir checkout
              echo "🔐 Adjusting permissions for git checkout..."
              sudo chown -R ubuntu:ubuntu . 2>/dev/null || echo "⚠️ Warning: chown failed, continuing..."
              
              # Inicializar git y configurar remote
              if [ "$IS_GIT_REPO" = false ]; then
                echo "🔧 Initializing git repository..."
                git init
              fi
              
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/tausePro/tause-pro.git || git remote set-url origin https://github.com/tausePro/tause-pro.git
              
              # Determinar qué rama usar
              DEPLOY_BRANCH="${{ github.event.inputs.branch || 'staging' }}"
              echo "📥 Fetching and checking out branch: $DEPLOY_BRANCH"
              git fetch origin || { echo "❌ Error: git fetch failed"; exit 1; }
              git checkout -f -b $DEPLOY_BRANCH origin/$DEPLOY_BRANCH || { echo "❌ Error: Cannot checkout branch $DEPLOY_BRANCH"; exit 1; }
              
              # Restaurar permisos correctos después del checkout
              echo "🔐 Restoring correct permissions..."
              sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || echo "⚠️ Warning: chown storage/cache failed"
              sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || echo "⚠️ Warning: chmod storage/cache failed"
            else
              # Es un repo git válido, hacer pull normal
              echo "✅ Git repository found with commits"
              
              # Verificar que estamos en la rama correcta
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "📍 Current branch: $CURRENT_BRANCH"
              
              # Fetch y pull
              echo "📥 Fetching latest changes..."
              git fetch origin || { echo "❌ Error: git fetch failed"; exit 1; }
              
              # Determinar qué rama usar
              DEPLOY_BRANCH="${{ github.event.inputs.branch || 'staging' }}"
              echo "📍 Target branch: $DEPLOY_BRANCH"
              
              if [ "$DEPLOY_BRANCH" != "$CURRENT_BRANCH" ]; then
                echo "🔄 Switching to branch: $DEPLOY_BRANCH"
                git checkout -f $DEPLOY_BRANCH || git checkout -f -b $DEPLOY_BRANCH origin/$DEPLOY_BRANCH || { echo "❌ Error: Cannot checkout branch $DEPLOY_BRANCH"; exit 1; }
              fi
              
              echo "📥 Pulling latest changes..."
              git pull origin $DEPLOY_BRANCH || { echo "❌ Error: git pull failed"; exit 1; }
            fi
            
            # Asegurar permisos antes de continuar
            echo "🔐 Ensuring correct permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || echo "⚠️ Warning: chown storage/cache failed"
            sudo chmod -R 775 storage bootstrap/cache 2>/dev/null || echo "⚠️ Warning: chmod storage/cache failed"
            
            # Verificar cambios
            echo "📋 Latest commit:"
            git log -1 --oneline
            
            # Configurar base de datos y .env
            echo "🗄️ Configuring database and .env..."
            
            # Crear base de datos y usuario si no existen
            sudo mysql -e "CREATE DATABASE IF NOT EXISTS magicai_staging CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" 2>/dev/null || echo "⚠️ Database creation skipped"
            
            # Crear o actualizar usuario (ALTER USER actualiza la contraseña si existe)
            sudo mysql -e "CREATE USER IF NOT EXISTS 'magicai_staging'@'localhost' IDENTIFIED BY 'staging_password_2024';" 2>/dev/null || echo "⚠️ User creation skipped"
            sudo mysql -e "ALTER USER 'magicai_staging'@'localhost' IDENTIFIED BY 'staging_password_2024';" 2>/dev/null || echo "⚠️ User password update skipped"
            sudo mysql -e "GRANT ALL PRIVILEGES ON magicai_staging.* TO 'magicai_staging'@'localhost';" 2>/dev/null || echo "⚠️ Grant privileges skipped"
            sudo mysql -e "FLUSH PRIVILEGES;" 2>/dev/null || echo "⚠️ Flush privileges skipped"
            
            # Verificar que el usuario puede conectarse
            mysql -u magicai_staging -pstaging_password_2024 -e "SELECT 1;" 2>/dev/null && echo "✅ Database user verified" || echo "⚠️ Database user verification failed"
            
            # Asegurar que .env existe
            if [ ! -f .env ]; then
              echo "📝 Creating .env from .env.example..."
              sudo cp .env.example .env 2>/dev/null || echo "⚠️ .env.example not found"
            fi
            
            # Configurar .env con credenciales correctas
            echo "🔧 Updating .env database configuration..."
            sudo chown ubuntu:ubuntu .env 2>/dev/null || echo "⚠️ chown .env failed"
            sudo chmod 664 .env 2>/dev/null || echo "⚠️ chmod .env failed"
            
            # Actualizar configuración de base de datos en .env
            sed -i 's/^DB_DATABASE=.*/DB_DATABASE=magicai_staging/' .env 2>/dev/null || echo "DB_DATABASE=magicai_staging" >> .env
            sed -i 's/^DB_USERNAME=.*/DB_USERNAME=magicai_staging/' .env 2>/dev/null || echo "DB_USERNAME=magicai_staging" >> .env
            sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=staging_password_2024/' .env 2>/dev/null || echo "DB_PASSWORD=staging_password_2024" >> .env
            sed -i 's/^APP_ENV=.*/APP_ENV=staging/' .env 2>/dev/null || echo "APP_ENV=staging" >> .env
            sed -i 's|^APP_URL=.*|APP_URL=https://test.tause.pro|' .env 2>/dev/null || echo "APP_URL=https://test.tause.pro" >> .env
            
            # Restaurar permisos correctos de .env
            sudo chown www-data:www-data .env 2>/dev/null || echo "⚠️ chown .env final failed"
            sudo chmod 640 .env 2>/dev/null || echo "⚠️ chmod .env final failed"
            
            echo "✅ Database and .env configured"
            
            # Eliminar laravel/boost completamente (es solo para desarrollo)
            echo "🧹 Removing laravel/boost completely (dev-only package)..."
            composer remove laravel/boost --no-interaction 2>/dev/null || echo "⚠️ laravel/boost not in composer.json"
            # Eliminar físicamente el directorio si existe
            sudo rm -rf vendor/laravel/boost 2>/dev/null || echo "⚠️ vendor/laravel/boost directory not found"
            
            # Limpiar TODOS los cachés ANTES de composer install
            echo "🧹 Clearing all caches before composer install..."
            php8.3 artisan config:clear 2>/dev/null || echo "⚠️ config:clear failed"
            php8.3 artisan cache:clear 2>/dev/null || echo "⚠️ cache:clear failed"
            php8.3 artisan route:clear 2>/dev/null || echo "⚠️ route:clear failed"
            php8.3 artisan view:clear 2>/dev/null || echo "⚠️ view:clear failed"
            # Eliminar archivos de caché de bootstrap que pueden tener referencias a boost
            sudo rm -f bootstrap/cache/services.php bootstrap/cache/packages.php 2>/dev/null || echo "⚠️ bootstrap cache files not found"
            
            # Regenerar autoloader para eliminar referencias a boost
            echo "🔄 Regenerating autoloader..."
            composer dump-autoload --optimize 2>/dev/null || echo "⚠️ dump-autoload failed"
            
            # Instalar/actualizar dependencias (con dev para Debugbar y otras herramientas)
            echo "📦 Installing dependencies..."
            composer install --optimize-autoloader --no-interaction || { echo "⚠️ Warning: composer install failed, but continuing..."; }
            
            # Compilar assets frontend
            echo "🎨 Building frontend assets..."
            if [ -f package.json ]; then
              npm install --production=false || echo "⚠️ Warning: npm install failed, but continuing..."
              npm run build || echo "⚠️ Warning: npm build failed, but continuing..."
            else
              echo "⚠️ No package.json found, skipping npm build"
            fi
            
            # Publicar assets de extensiones (chatbot, etc.)
            echo "📦 Publishing extension assets..."
            php8.3 artisan vendor:publish --tag=extension --force || echo "⚠️ Warning: vendor:publish failed, but continuing..."
            
            # Ejecutar migraciones
            echo "🗄️ Running migrations..."
            php8.3 artisan migrate --force || { echo "⚠️ Warning: Migrations failed, but continuing..."; }
            
            # Limpiar cachés nuevamente después de composer install
            echo "🧹 Clearing caches after composer install..."
            php8.3 artisan config:clear || echo "⚠️ Warning: config:clear failed"
            php8.3 artisan cache:clear || echo "⚠️ Warning: cache:clear failed"
            php8.3 artisan view:clear || echo "⚠️ Warning: view:clear failed"
            
            # Aplicar fix de Nginx para chatbot frame (permitir embedding cross-origin)
            # TEMPORALMENTE DESHABILITADO - Se aplicará manualmente después
            # echo "🔧 Applying Nginx fix for chatbot frame..."
            # if [ -f scripts/fix-nginx-chatbot-frame.sh ]; then
            #   chmod +x scripts/fix-nginx-chatbot-frame.sh
            #   bash scripts/fix-nginx-chatbot-frame.sh || echo "⚠️ Warning: Nginx fix encountered issues, but continuing deployment..."
            # else
            #   echo "⚠️ Script fix-nginx-chatbot-frame.sh not found, skipping Nginx fix"
            # fi
            echo "⏭️  Skipping Nginx fix (temporarily disabled)"
            
            # Asegurar permisos
            echo "🔐 Setting permissions..."
            sudo chown -R www-data:www-data storage bootstrap/cache || echo "⚠️ Warning: chown failed"
            sudo chmod -R 775 storage bootstrap/cache || echo "⚠️ Warning: chmod failed"
            
            # Verificar versión
            echo "📌 Current version:"
            cat version.txt || echo "⚠️ No version.txt found"
            
            echo "✅ Deployment completed successfully!"

      - name: Health Check
        run: |
          echo "✅ Staging deployment completed"
          echo ""
          echo "🔍 Verification steps:"
          echo "  - Visit: https://test.tause.pro"
          echo "  - Check dashboard: https://test.tause.pro/dashboard/admin"
          echo "  - Verify migrations: ssh -i ~/.ssh/staging_key.pem ubuntu@${{ env.STAGING_HOST }} 'cd ${{ env.PROJECT_PATH }} && php8.3 artisan migrate:status | tail -5'"
          echo ""
          echo "📝 View logs:"
          echo "  ssh -i ~/.ssh/staging_key.pem ubuntu@${{ env.STAGING_HOST }} 'tail -50 ${{ env.PROJECT_PATH }}/storage/logs/laravel.log'"

